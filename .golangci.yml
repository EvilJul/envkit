# golangci-lint config for EnvKit CLI packages
run:
  timeout: 5m
  modules-download-mode: readonly
  go: "1.25"

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-dirs:
    - frontend
    - envkit-gui
  exclude-files:
    - '^main\.go$'
    - '^cmd/gui/.*$'
