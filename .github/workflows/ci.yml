name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# CLI packages only — GUI entrypoints embed frontend/dist and are built by
# the desktop workflow after the frontend is generated.

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Get dependencies
      run: go mod download

    - name: Format check
      run: |
        unformatted=$(gofmt -s -l . | grep -v '^frontend/' | grep -v '^envkit-gui/' || true)
        if [ -n "$unformatted" ]; then
          echo "Code is not formatted:"
          echo "$unformatted"
          exit 1
        fi
      shell: bash

    - name: Vet
      run: go vet ./cmd/envkit/... ./internal/...

    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./cmd/envkit/... ./internal/...

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        # Install from source with the job's Go toolchain so the linter
        # Go version is not older than go.mod (avoids go1.24 < go1.25 errors).
        install-mode: goinstall
        version: latest
        args: --timeout=5m ./cmd/envkit/... ./internal/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build -v ./cmd/envkit

    - name: Test binary
      run: |
        ./envkit version
        ./envkit help
