name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.21', '1.22', '1.23']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Get dependencies
      run: go mod download

    - name: Create dummy frontend/dist for embed
      run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

    - name: Format check
      run: |
        # 排除GUI相关文件（需要frontend构建）
        UNFORMATTED=$(gofmt -s -l . | grep -v '^frontend/' | grep -v '^main\.go$' || true)
        if [ ! -z "$UNFORMATTED" ]; then
          echo "Code is not formatted:"
          echo "$UNFORMATTED"
          exit 1
        fi
      shell: bash

    - name: Vet
      run: |
        # 检查所有包，排除GUI主程序（需要frontend/dist）
        go vet $(go list ./... | grep -v '^github.com/fusheng/envkit$')
      shell: bash

    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v ./cmd/envkit

    - name: Test binary
      run: |
        ./envkit version
        ./envkit help
