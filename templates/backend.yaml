version: "1.0"
name: "Backend Development Stack"

languages:
  - name: go
    version: "1.23"
    mirror: goproxy
  - name: python
    version: "3.12"
    mirror: tsinghua

tools:
  - git
  - docker
  - vscode

databases:
  - name: postgresql
    version: "16"
    docker: true
  - name: redis
    version: "7"
    docker: true

shell:
  type: zsh
  plugins:
    - oh-my-zsh
